[package]
edition = "2024"
name = "nodem-nrf9151"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[features]
std = []

[dependencies]
embassy-executor = { version = "0.10.0",  features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf9151-s", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embedded-storage = "0.3"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
ssd1306-embassy = { git = "https://codeberg.org/Ferrys93de/ssd1306-embassy.git" }

nodem-rs = { git = "https://github.com/saschaklick/nodem-rs", features = ["base", "alloc", "runtime"] }
embedded-alloc = "0.6"
embassy-sync = "0.8.0"
static_cell = "2"

[patch."https://github.com/saschaklick/virtmach-rs"]
virtmach = { path = "../virtmach-rs" }

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/nrf9151/s" }
]
