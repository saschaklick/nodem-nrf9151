# Builds MCUboot as its own sysbuild image alongside zephyr-app, splitting
# flash into two 320KB OTA slots (mcuboot_primary/mcuboot_secondary - see
# pm_static.yml for how their size is controlled indirectly) instead of the
# single monolithic TF-M+app image this project shipped with before. This
# just makes the two slots and the bootloader that swaps between them exist;
# streaming an update into the secondary slot and requesting the upgrade is
# src/ota_store.c's job (driven by nodem-ffi's control.rs, "ota" uploads).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# NCS v3.4.1+: Partition Manager (what pm_static.yml configures) is being
# phased out in favor of devicetree-based partitioning, and is no longer
# enabled by default for nRF91 boards specifically (unlike other SoC
# families, which still default it on for now) - explicit opt-in required,
# or the build silently gets no pm_config.h and every PM_*_ADDRESS/PM_*_SIZE
# consumer (pkg_store.c, the nonsecure_storage/settings_storage layout below)
# fails to compile. Revisit this whole file when actually migrating to DTS
# partitioning (see nrf/doc/.../migration_partitions.rst and
# nrf/scripts/pm_to_dts.py in the SDK) rather than treating this as permanent.
SB_CONFIG_PARTITION_MANAGER=y
