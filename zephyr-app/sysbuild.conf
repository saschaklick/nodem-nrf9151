# Builds MCUboot as its own sysbuild image alongside zephyr-app, splitting
# flash into two 320KB OTA slots (mcuboot_primary/mcuboot_secondary - see
# pm_static.yml for how their size is controlled indirectly) instead of the
# single monolithic TF-M+app image this project shipped with before. Nothing
# currently streams an update into the secondary slot or requests an
# upgrade (that's the still-unbuilt OTA delivery path, separate from this) -
# this just makes the two slots and the bootloader that swaps between them
# exist.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
