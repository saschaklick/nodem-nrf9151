# Render nodem-rs's DOM runtime to the physical SSD1306 over I2C, and bring
# up the nRF9151 modem (modem_task.c) to reach the status endpoint over TLS.

# No CONFIG_DISPLAY - display_task.c talks to the SSD1306 directly over
# CONFIG_I2C, bypassing Zephyr's display subsystem entirely (its built-in
# ssd1306 driver produced garbled output on this panel).
CONFIG_I2C=y
CONFIG_GPIO=y

# TF-M's PSA Protected Storage and Internal Trusted Storage services are on
# by default but unused here - config_store.c goes through Zephyr's own
# settings/NVS against the "settings_storage" partition directly, never PSA's
# storage APIs. Turning these off drops tfm_ps/tfm_its/tfm_otp_nv_counters
# (Protected Storage's rollback-counter backing) entirely, along with the
# 32KB-SPU-alignment padding forced around each of those three small
# partitions - see pm_static.yml's own notes on why that space matters. That
# reclaimed ~96KB is what makes the two 320KB OTA slots (sysbuild.conf) fit
# at all under v3.4.1's TF-M. Considered porting device_secret specifically
# to PSA Protected Storage instead (real TF-M feature, would give it
# confidentiality/rollback protection) but decided against it: it costs back
# the same ~96KB, and its threat model (protects against a compromised NS
# app or flash-dump extraction) is largely moot anyway while
# UICR.APPROTECT/SECUREAPPROTECT are both left open for debugging (Makefile) -
# a physical SWD debugger can already read Secure flash/RAM directly. Staying
# on Zephyr's own settings/NVS.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048

# boot_write_img_confirmed()/boot_is_img_confirmed() (<zephyr/dfu/mcuboot.h>,
# used by heartbeat_task.c) - after `make flash-ota SLOT=1` lands a pending
# ("test") swap in the secondary slot (see the Makefile's own note),
# MCUboot boots it once without marking it permanent; if it's never
# confirmed before the next reset, MCUboot reverts back to the previous
# image automatically. This is what lets the new image call
# boot_write_img_confirmed() itself once it's proven stable, instead.
# IMG_MANAGER (the menuconfig gate) requires STREAM_FLASH; MCUBOOT_IMG_MANAGER
# is its only real choice and pulls in MCUBOOT_BOOTUTIL_LIB itself.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# nodem_listener.c's nodem_hw_reset() (the "#reset" command, via nodem-ffi's
# control.rs) needs sys_reboot().
CONFIG_REBOOT=y

# config_store.c - small flash-backed key/value store for persisted config
# (Settings on top of NVS). Enabling CONFIG_SETTINGS_NVS makes the partition
# manager reserve a "settings_storage" flash partition automatically - its
# address/size are pinned in pm_static.yml now (moved to reclaim what used
# to be pure alignment padding), but nothing here needed to change for that.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y

# pkg_store.c - raw staging partition for an uploaded nodem-rs binary
# UI/Media package (see pm_static.yml's "pkg" partition and control.rs's
# IControlLoader impl).
# CONFIG_FLASH_PAGE_LAYOUT is needed for flash_get_page_info_by_offs(), used
# there to find the flash's actual erase-page size rather than assuming one.
CONFIG_FLASH_PAGE_LAYOUT=y

# Modem library - modem_task.c calls nrf_modem_lib_init() itself (rather
# than relying on any auto-init), so enabling this alone doesn't touch the
# modem before main() runs.
CONFIG_NRF_MODEM_LIB=y

# LTE link control (registration/PDN bring-up) and the PDN library (default
# context activation events), used by modem_task.c to connect and to check
# SIM readiness (AT+CPIN? via nrf_modem_at.h) while offline.
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_ESM_STRERROR=y

# Provisions the TLS root CA to the modem's key storage (modem-offloaded
# TLS - see IPPROTO_TLS_1_2 below - rather than a host-side TLS stack).
CONFIG_MODEM_KEY_MGMT=y

# Networking - offloaded sockets (the nRF9151 modem does TCP/TLS/DNS
# itself), no native netif needed.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_POSIX_API=y

# Websocket client - modem_task.c's step_websocket_connect() layers this on
# top of the same offloaded TLS socket used for registration. NCS v3.4.1's
# Zephyr rewrote the RFC 6455 handshake to validate Sec-WebSocket-Accept via
# psa_hash_compute(PSA_ALG_SHA_1, ...) instead of calling mbedtls_sha1()
# directly like the older Zephyr this project shipped against under NCS
# v2.8.0 did (that older direct-call approach was why this project carried
# its own src/sha1_shim.c providing a standalone mbedtls_sha1() - removed
# now that nothing calls it anymore, see git history if ever needed again).
# PSA builds only compile in algorithms explicitly requested, and SHA-1 was
# never requested (only CONFIG_PSA_WANT_ALG_SHA_256, for TLS) since the old
# code path bypassed PSA for this entirely - without this,
# psa_hash_compute(PSA_ALG_SHA_1, ...) fails with PSA_ERROR_NOT_SUPPORTED,
# which websocket_connect() surfaces as -EPROTO.
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_WEBSOCKET_CLIENT=y

# printk() over the DK's onboard UART console - moved to uart1 (the board
# overlay's `chosen` override), wired through the J-Link's second USB
# virtual COM port (VCOM1), separate from both the SWD debug port and the
# process_command UART (uart0, see uart_task.c). RTT was abandoned: it
# requires an open SWD connection, which this board's TF-M setup re-locks
# on every boot, making RTT capture impossible without erasing (and thus
# stopping) the firmware each time. UART works regardless of the debug
# port's lock state.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Dedicated process_command UART (uart0) - interrupt-driven RX so
# uart_task.c's ISR can drain the FIFO into a ring buffer without losing
# bytes; nRF's UARTE has no real RX FIFO depth, so anything less than
# interrupt-driven (e.g. plain polling) drops bytes at any real baud rate.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

