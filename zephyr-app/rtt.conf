# Opt-in build fragment: view logs over RTT/SWD (`make logs-rtt`) instead of
# the default UART console (`make logs`). Applied on top of prj.conf via
# `-DEXTRA_CONF_FILE=rtt.conf` (see the Makefile's build-rtt target) into a
# separate build directory - the plain `make build`/`make logs` UART flow is
# untouched and stays the default; this is a second, parallel option, not a
# replacement.
#
# Needs CONFIG_UART_CONSOLE explicitly off: Zephyr's console drivers each
# install their own printk hook at init, so whichever one initializes last
# silently wins if both are left enabled - rather than depend on init-order
# behavior, this build variant is RTT-only.
#
# This only became viable once the debug port reliably stays open across a
# reset (see the Makefile's own note on UICR.APPROTECT/SECUREAPPROTECT) -
# RTT needs a live, unlocked SWD connection to read the target's RAM ring
# buffer, which is exactly what used to be locked after every boot.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
