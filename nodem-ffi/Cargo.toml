[package]
name = "nodem-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
nodem-rs = { git = "https://github.com/saschaklick/nodem-rs", features = ["base", "alloc", "runtime"] }
embedded-alloc = "0.6"
critical-section = { version = "1.2", features = ["restore-state-u32"] }
log = "0.4"

# Mirrors zephyr-app's Kconfig APP_LOG_LEVEL choice (log.h) one-to-one, so
# the Rust side (this crate's own log::info!/error! calls, and nodem-rs's -
# it uses all four levels internally too) drops the same way as the C side
# for a given LOG_LEVEL (see the Makefile). log's max_level_* features strip
# log macro calls entirely at compile time (not just filter them at
# runtime), matching log.h's macros compiling to nothing rather than just
# going quiet. No `default` max_level - the Makefile always passes one of
# these explicitly - so a bare `cargo build` outside the Makefile (e.g. from
# an editor) intentionally gets the crate's unrestricted default instead of
# silently picking one of these for you.
[features]
std = []
log-debug = ["log/max_level_debug"]
log-info = ["log/max_level_info"]
log-warn = ["log/max_level_warn"]
log-error = ["log/max_level_error"]
log-none = ["log/max_level_off"]

[patch."https://github.com/saschaklick/virtmach-rs"]
virtmach = { path = "../../virtmach-rs" }

[profile.release]
debug = 2
# The signed app image (TF-M + app) must stay under MCUboot's usable slot
# size - 0x4E000 bytes, not the full 320KB slot (see the Makefile's
# OTA_MAX_IMAGE_SIZE) - or MCUboot rejects it at boot with "Image in the
# primary slot is not valid!" and never starts it. LTO with a single codegen
# unit trims ~33KB off the Rust side at no speed cost; opt-level = "s" would
# save another ~27KB if that's ever needed, at the cost of slower rendering.
lto = true
codegen-units = 1
